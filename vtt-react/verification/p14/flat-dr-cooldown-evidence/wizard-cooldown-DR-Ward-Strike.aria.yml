  - text: Step 7 of 10 Cooldown
  - paragraph: Configure how frequently your spell can be used by setting its cooldown. Choose a type of cooldown that fits the spell's power level and the intended gameplay.
  - heading "Cooldown Type" [level=4]
  - button "No Cooldown"
  - button "Authenticated Caster Starts"
  - button "Turn Based"
  - button "Charge Based"
  - button "Short Rest"
  - button "Long Rest"
  - button "Dice Based"
  - text: Caster-turn starts to count (1–10)
  - spinbutton "Caster-turn starts to count (1–10)": "1"
  - paragraph: "Cooldown: 1 strictly upcoming caster-turn start. Starts with the accepted cast; the ongoing turn does not count. Copies and versions of this definition share it for this exact actor. Combat end/restart never resets it."
  - paragraph: "One primary owner PC → one placed creature; immediate damage OR healing, optionally with one periodic effect of the same kind; a periodic effect on its own; a movement or Stunned effect, optionally with an immediate damage OR healing part, which may carry one save that negates only that effect; or one Agility, Intelligence or Spirit change, optionally with a plain immediate damage OR healing part and no save. AP/mana only. With a save, the cooldown starts on either recorded outcome, because the price and the immediate part apply on both. Requires authenticated combat tracking. This controls reuse, not effect duration, acquisition or resource price: a periodic effect keeps its own tick count, and removing it or its last tick never releases the cooldown; a movement, Stunned or attribute effect keeps its own expiry, and removing or expiring it never releases the cooldown, nor does the release remove it. A second change to the same attribute remains refused even after cooldown release. A retired clock leaves an unreleased cooldown blocked for manual adjudication."
  - paragraph: "Positive flat DR (+1 to +20, whole number) also supports this cooldown, with an optional plain immediate damage OR healing part and no save. Its expiry stays independent: removal or expiry never releases the cooldown, and cooldown release never removes the DR effect. A second flat DR effect remains refused even after cooldown release."
